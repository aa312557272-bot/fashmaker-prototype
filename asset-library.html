function switchMain(next){main=next;document.querySelectorAll('[data-main]').forEach(b=>b.classList.toggle('on',b.dataset.main===next));document.querySelector('#materialTabs').style.display=next==='materials'?'flex':'none';document.querySelector('#eyebrow').textContent=next==='materials'?'ASSET LIBRARY · MATERIALS':'BRAND ASSETS · PRODUCTS';document.querySelector('#title').textContent=next==='materials'?'素材':'商品';document.querySelector('#subtitle').textContent=next==='materials'?'管理生成、上传和收藏的创作素材。':'独立管理商品信息与关联素材，便于后续创作时快速调用。';document.querySelector('#filter').innerHTML=next==='materials'?'<option value="all">全部类型</option><option>AI 生成</option><option>上传素材</option><option>商品图</option>':'<option value="all">全部商品</option><option>有商品素材</option><option>暂无素材</option>';document.querySelector('#search').placeholder=next==='materials'?'搜索素材名称或商品名称':'搜索商品名称、描述或卖点';if(next==='materials'){view='grid';applyView()}renderProducts();renderMaterials();toggleEmpty(false)}

let activeProduct=null,editDraft=null,draftAssets=[],assetFilter='all';function openProduct(name){activeProduct=products.find(p=>p.name===name);if(!activeProduct)return;editDraft={...activeProduct,uspList:activeProduct.usp.split(/[，,、]/).map(x=>x.trim()).filter(Boolean)};draftAssets=[...new Set([...(activeProduct.assets||[activeProduct.img]),...linkedResults(activeProduct).map(item=>item.preview)])];document.querySelector('#drawerCover').src=activeProduct.img;document.querySelector('#productName').value=editDraft.name;document.querySelector('#productDesc').value=editDraft.desc;renderUsps(editDraft.uspList);renderAssetGallery();document.querySelector('#drawerShade').classList.add('open')}function closeDrawer(){document.querySelector('#drawerShade').classList.remove('open');activeProduct=null;editDraft=null}function renderUsps(a){document.querySelector('#uspList').innerHTML=a.map((x,i)=>`<div class="usp-line"><input class="usp-input" value="${x.replaceAll('"','&quot;')}" aria-label="卖点 ${i+1}"><button class="remove-usp" type="button">×</button></div>`).join('')}function renderAssetGallery(){if(!activeProduct)return;const gallery=document.querySelector('#assetGallery');gallery.replaceChildren();const shown=draftAssets.filter(src=>{const m=materials.find(x=>x[2]===src);const video=m?.[1]==='视频'||m?.[1]==='AI 视频';return assetFilter==='all'||(assetFilter==='video'?video:!video)});for(const src of shown){const video=materials.find(x=>x[2]===src)?.[1]==='视频'||materials.find(x=>x[2]===src)?.[1]==='AI 视频';const tile=document.createElement('div');tile.className='asset-tile';tile.dataset.src=src;const media=document.createElement(video?'video':'img');media.src=src;if(video){media.muted=true;media.preload='metadata'}else media.alt='商品素材';const label=document.createElement('span');label.className='asset-label';label.textContent=video?'▣ 视频':'▧ 图片';const preview=document.createElement('button');preview.type='button';preview.className='asset-preview-action';preview.dataset.action='preview';preview.setAttribute('aria-label','预览素材');preview.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';const remove=document.createElement('button');remove.type='button';remove.className='asset-remove-action';remove.dataset.action='remove';remove.setAttribute('aria-label','删除素材');remove.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 10v7M14 10v7"/></svg>';tile.append(media,label,preview,remove);gallery.append(tile)}if(!shown.length){const empty=document.createElement('p');empty.textContent='暂无素材，可上传文件或从素材库添加';empty.style.cssText='grid-column:1/-1;color:#929791;font-size:12px';gallery.append(empty)}}

document.querySelector('#productGrid').addEventListener('click',e=>{if(batchMode){if(!e.target.matches('.selectbox')){const c=e.target.closest('.card')?.querySelector('.selectbox');if(c){c.checked=!c.checked;c.dispatchEvent(new Event('change',{bubbles:true}))}}return}const card=e.target.closest('.card');if(card)openProduct(card.dataset.name)});document.querySelector('#productRows').addEventListener('click',e=>{const row=e.target.closest('tr');if(row&&!batchMode)openProduct(row.dataset.item)});document.querySelector('#drawerClose').onclick=closeDrawer;document.querySelector('#drawerCancel').onclick=closeDrawer;document.querySelector('#drawerShade').addEventListener('click',e=>{if(e.target.id==='drawerShade')closeDrawer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});document.querySelector('#productName').addEventListener('input',e=>{if(editDraft)editDraft.name=e.target.value});document.querySelector('#productDesc').addEventListener('input',e=>{if(editDraft)editDraft.desc=e.target.value});document.querySelector('#uspList').addEventListener('input',()=>{if(editDraft)editDraft.uspList=[...document.querySelectorAll('.usp-input')].map(x=>x.value)});document.querySelector('#uspList').addEventListener('click',e=>{if(e.target.matches('.remove-usp')){e.target.parentElement.remove();if(editDraft)editDraft.uspList=[...document.querySelectorAll('.usp-input')].map(x=>x.value)}});document.querySelector('#addUsp').onclick=()=>{let d=document.createElement('div');d.className='usp-line';d.innerHTML='<input class="usp-input" placeholder="输入商品卖点"><button class="remove-usp" type="button">×</button>';document.querySelector('#uspList').append(d);d.querySelector('input').focus()};document.querySelector('#assetGallery').addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;const tile=button.closest('.asset-tile');const src=tile.dataset.src;if(button.dataset.action==='remove'){window.FashGeneratedAssets?.unlink(activeProduct?.id,src);draftAssets=draftAssets.filter(x=>x!==src);if(editDraft)editDraft.assets=[...draftAssets];renderAssetGallery();return}openAssetPreview(src)});document.querySelectorAll('[data-asset-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-asset-filter]').forEach(x=>x.classList.toggle('on',x===b));assetFilter=b.dataset.assetFilter;renderAssetGallery()});document.querySelector('#assetLibraryBtn').onclick=()=>openDetailLibrary();document.querySelector('#uploadAssetBtn').onclick=()=>document.querySelector('#assetFileInput').click();document.querySelector('#assetFileInput').onchange=e=>{for(const f of e.target.files){let url=URL.createObjectURL(f);materials.push([f.name,f.type.startsWith('video/')?'视频':'上传素材',url]);draftAssets.push(url)}if(activeProduct)renderAssetGallery();e.target.value=''};document.querySelector('#aiWrite').onclick=()=>{if(!activeProduct||!editDraft)return;editDraft.name=`${activeProduct.name}｜轻奢实用款`;editDraft.desc=`${activeProduct.name}，精选实用设计，兼顾日常使用体验与细节质感，适合通勤、居家及日常使用。`;editDraft.uspList=['品质材质与精致做工','设计简洁易搭配','使用方便适合日常','细节贴心提升体验'];document.querySelector('#productName').value=editDraft.name;document.querySelector('#productDesc').value=editDraft.desc;renderUsps(editDraft.uspList);toast('已根据商品图片生成标题、描述和卖点，可继续编辑')};document.querySelector('#saveProduct').onclick=()=>{if(!activeProduct||!editDraft)return;activeProduct.name=document.querySelector('#productName').value.trim()||'未命名商品';activeProduct.desc=document.querySelector('#productDesc').value;activeProduct.usp=[...document.querySelectorAll('.usp-input')].map(x=>x.value.trim()).filter(Boolean).join('、');activeProduct.assets=[...draftAssets];activeProduct.n=draftAssets.length;persistAssetProducts();renderProducts();closeDrawer();toast('商品信息已保存')};
