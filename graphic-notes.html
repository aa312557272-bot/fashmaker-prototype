<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FashMaker · 图文笔记</title><link rel="stylesheet" href="ai-tryon.css?v=20261110-models-2"><link rel="stylesheet" href="prototype-links.css?v=20261110-models-2"><link rel="stylesheet" href="graphic-notes.css?v=20261110-models-2"></head><body>
<aside class="sidebar"><div class="brand">FM <strong>FashMaker</strong></div><nav><a href="index.html">详情图生成</a><a href="product-suite.html">商品套图</a><a href="product-video.html">商品生视频</a><a href="graphic-notes.html" class="active" aria-current="page">图文笔记</a><a href="asset-library.html">资产库</a></nav><small>个人空间 · 本地交互原型</small></aside>
<main><header class="topbar"><strong>图文笔记</strong><div><button id="history">历史记录</button> <button id="newTask">＋ 新建</button></div></header><div class="note-layout"><section class="chat"><header class="chat-head"><div><b>图文笔记 Agent</b><small>把灵感，聊成一篇好笔记</small></div><span class="online">● 就绪</span></header><div class="source"><div id="inputs"></div><div class="source-actions"><button id="upload">＋ 上传素材</button><button id="product">选择商品</button><button id="clear">清空素材</button></div><small id="sourceLabel">选填 · 最多 9 张图片</small><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></div><div id="messages" class="messages" aria-live="polite"></div><form id="chatForm" class="composer"><label for="request">描述你的想法</label><textarea id="request" maxlength="2000" placeholder="例如：帮我写一篇周末穿搭笔记，温柔自然一点，配 4 张图…"></textarea><div><small>Enter 发送 · Shift + Enter 换行</small><button id="send" class="primary">发送并生成 ↑</button></div></form></section>
<section class="note-workspace"><header class="note-toolbar"><div class="modes" role="group" aria-label="预览模式"><button data-mode="full" aria-pressed="true" class="selected">全文模式</button><button data-mode="grid" aria-pressed="false">平铺模式</button><button data-mode="cover" aria-pressed="false">封面预览</button></div><div class="tools"><select id="version" aria-label="生成版本" disabled><option>暂无版本</option></select><button id="publish" disabled>发布</button><button id="download" disabled>下载</button></div></header><div id="stage" aria-live="polite"></div><footer class="demo-note">本地交互演示 · 示例文案与素材排版，未接入真实 AI 或社交平台发布</footer></section></div></main>
<dialog id="picker"><header><h2>选择商品</h2><button data-close="picker">关闭</button></header><div id="products" class="options"></div></dialog>
<dialog id="historyDialog" class="history-drawer"><header><h2>图文笔记历史</h2><button data-close="historyDialog">关闭</button></header><div id="historyBody"></div></dialog>
<dialog id="publishDialog"><header><h2>发布到社交平台</h2><button data-close="publishDialog">关闭</button></header><p class="muted">选择平台，模拟提交当前版本的标题、正文和全部配图。不会实际发布。</p><div id="platforms" class="platforms"></div><p id="publishError" role="alert"></p><footer><button data-close="publishDialog">取消</button> <button id="confirmPublish" class="primary">确认发布（演示）</button></footer></dialog><div id="toast" role="status"></div><script src="graphic-notes.js?v=20261110-models-2"></script><script src="shared-sidebar.js?v=20261112-model-management"></script><script src="custom-models.js?v=20261112-model-management"></script><script src="prototype-links.js?v=20261110-models-2"></script></body></html>
