<script src="prototype-generated-assets.js"></script><script>
const prefix='fashmaker-batch:';let seed={mode:'main',global:{},tasks:[]};try{if(window.name.startsWith(prefix)){seed=JSON.parse(window.name.slice(prefix.length));window.name=''}}catch(e){};
const defaultGlobal={platform:'智能匹配',market:'美国',imageTypes:[],language:'无文字(纯视觉)',model:'Nano Banana 2',ratio:'1:1 正方形',quality:'1K 标准',count:'1 张',module:'smart',...seed.global};let mode=seed.mode||'main',tasks=seed.tasks?.length?seed.tasks.map((t,i)=>({...t,id:t.id||crypto.randomUUID(),name:t.name||`商品任务 ${i+1}`,images:(t.images||[]).slice(0,6),sellingPoints:t.sellingPoints??t.brief??'',styleMode:t.styleMode||'recommended',style:t.style||'极简纯白科技轻奢风',customStyle:t.customStyle||'',override:null,collapsed:false,plan:''})):[];
const el=id=>document.getElementById(id),toast=msg=>{const t=el('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)};
for(const [k,v] of Object.entries(defaultGlobal)){const node=el(k);if(node)node.value=v}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const historyStorageKey='fashmaker-batch-image-history';
let historyRecords=[];try{historyRecords=JSON.parse(localStorage.getItem(historyStorageKey)||'[]')}catch(e){historyRecords=[]}let activeSubmittedBatchId=null;
function formatHistoryTime(value){const d=new Date(value);return isNaN(d)?String(value||''):d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}
function historyImageMarkup(images=[]){return images.length?images.map(im=>im.src?`<img src="${esc(im.src)}" alt="${esc(im.name||'商品图')}" data-history-image>`:`<span class="history-image-placeholder"><i class="fa-regular fa-image"></i></span>`).join(''):'<span class="history-image-placeholder"><i class="fa-regular fa-image"></i></span>'}
function renderHistoryList(){const root=el('historyList');if(!historyRecords.length){root.innerHTML='<div class="history-empty"><b>还没有生图历史</b>生成批量方案后，历史批次会显示在这里。</div>';return}root.innerHTML=historyRecords.map(r=>{const total=r.total||r.tasks?.length||0,done=r.completed??total,pct=total?Math.round(done/total*100):0;return `<button class="history-entry" data-history-id="${esc(r.id)}"><span class="history-entry-top"><span class="history-entry-title">${esc(r.title)}</span><span class="history-status">${esc(r.status||'方案已生成')}</span></span><span class="history-time">${esc(formatHistoryTime(r.createdAt))} · ${r.mode==='main'?'主图':'详情图'}</span><span class="history-progress-row"><span class="history-progress"><i style="width:${pct}%"></i></span><span class="history-progress-label">${done}/${total} · ${pct}%</span></span></button>`}).join('');root.querySelectorAll('[data-history-id]').forEach(button=>button.onclick=()=>openHistoryRecord(button.dataset.historyId))}
function renderHistoryDetail(record){const root=el('historyDetailContent'),recordTasks=record.tasks||[],total=record.total||recordTasks.length,done=record.completed??total,pct=total?Math.round(done/total*100):0;root.innerHTML=`<div class="history-detail-card"><h2 class="history-detail-title">${esc(record.title)}</h2><p class="history-detail-sub">${esc(formatHistoryTime(record.createdAt))} · ${esc(record.status||'生成中')}</p><div class="history-progress-panel"><div class="history-progress-row"><span>完成进度</span><b style="margin-left:auto">${done}/${total} · ${pct}%</b></div><div class="history-progress-row"><span class="history-progress"><i style="width:${pct}%"></i></span></div></div><div class="history-meta-grid"><div class="history-meta"><small>图片类型</small><strong>${record.mode==='main'?'商品主图':'商品详情图'}</strong></div><div class="history-meta"><small>商品任务</small><strong>${total} 个</strong></div></div><p class="history-detail-sub" style="margin:14px 0 0">创建时间：${esc(formatHistoryTime(record.createdAt))}</p></div><h3 class="history-section-title">商品任务与效果图</h3>${recordTasks.map((t,i)=>{const preview=t.resultImages?.[0]?.src;return `<details class="history-product"><summary><span class="history-product-summary-preview">${preview?`<img src="${esc(preview)}" alt="" data-history-image>`:'<i class="fa-regular fa-image"></i>'}</span><span>${esc(t.name||`商品任务 ${i+1}`)}</span><span class="history-status">${esc(t.status||record.status||'排队中')}</span></summary><div class="history-product-content"><p class="history-output-title">最终效果图</p><div class="history-result-gallery">${historyImageMarkup(t.resultImages||[])}</div><div class="history-param-grid"><div class="history-param"><small>目标平台</small><b>${esc(t.platform||'智能匹配')}</b></div><div class="history-param"><small>目标市场</small><b>${esc(t.market||'—')}</b></div><div class="history-param"><small>目标语言</small><b>${esc(t.language||'—')}</b></div><div class="history-param"><small>模型</small><b>${esc(t.model||'—')}</b></div><div class="history-param"><small>尺寸比例</small><b>${esc(t.ratio||'—')}</b></div><div class="history-param"><small>清晰度</small><b>${esc(t.quality||'—')}</b></div></div><details class="history-copy-fold"><summary>商品卖点</summary><p>${esc(t.sellingPoints||'未填写')}</p></details><details class="history-copy-fold"><summary>设计风格</summary><p>${esc(t.style||'未指定')}</p></details><details class="history-copy-fold"><summary>原始商品图（${t.images?.length||0}）</summary><div class="history-result-gallery">${historyImageMarkup(t.images||[])}</div></details></div></details>`}).join('')||'<div class="history-empty">该批次暂无商品任务信息。</div>'}`}
function bindHistoryImageFallback(){document.querySelectorAll('[data-history-image]').forEach(img=>img.onerror=()=>{const fallback=document.createElement('span');fallback.className='history-image-placeholder';fallback.innerHTML='<i class="fa-regular fa-image"></i>';img.replaceWith(fallback)})}
function openHistoryRecord(id){const record=historyRecords.find(r=>r.id===id);if(!record)return;renderHistoryDetail(record);bindHistoryImageFallback();el('historyListView').hidden=true;el('historyDetailView').hidden=false}
function openHistoryDrawer(recordId=null){renderHistoryList();el('historyListView').hidden=false;el('historyDetailView').hidden=true;el('historyBackdrop').classList.add('open');el('historyDrawer').classList.add('open');el('historyDrawer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';if(recordId)openHistoryRecord(recordId)}
function closeHistoryDrawer(){el('historyBackdrop').classList.remove('open');el('historyDrawer').classList.remove('open');el('historyDrawer').setAttribute('aria-hidden','true');document.body.style.overflow=''}
const taskAssetCatalog=[{src:'https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=700&q=85',name:'无线耳机 · 商品主图'},{src:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=85',name:'无线耳机 · 细节图'},{src:'https://images.unsplash.com/photo-1490312278390-ab64016e0aa9?auto=format&fit=crop&w=700&q=85',name:'无线耳机 · 使用场景'},{src:'https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?auto=format&fit=crop&w=700&q=85',name:'护肤精华 · 商品素材'},{src:'https://images.unsplash.com/photo-1513708927688-890fe8c8c3d3?auto=format&fit=crop&w=700&q=85',name:'家居用品 · 白底商品图'},{src:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=85',name:'腕表 · 商品展示图'}];let activeAssetTaskId=null,selectedAssetIndexes=[];
function openTaskAssets(taskId){activeAssetTaskId=taskId;selectedAssetIndexes=[];renderTaskAssetGrid();el('taskAssetModal').classList.add('open');document.body.style.overflow='hidden'}
function closeTaskAssets(){el('taskAssetModal').classList.remove('open');if(!el('historyDrawer').classList.contains('open'))document.body.style.overflow='';activeAssetTaskId=null;selectedAssetIndexes=[]}
function renderTaskAssetGrid(){const root=el('taskAssetGrid'),task=tasks.find(t=>t.id===activeAssetTaskId),remaining=Math.max(0,6-(task?.images.length||0));el('taskAssetCount').textContent=`已选择 ${selectedAssetIndexes.length} 张 · 当前任务还可添加 ${remaining} 张`;root.innerHTML=taskAssetCatalog.map((asset,i)=>`<button class="task-asset ${selectedAssetIndexes.includes(i)?'selected':''}" data-asset-index="${i}" type="button"><img src="${asset.src}" alt="${esc(asset.name)}"><span>${esc(asset.name)}</span><i class="task-asset-check">${selectedAssetIndexes.includes(i)?'✓':'+'}</i></button>`).join('');root.querySelectorAll('[data-asset-index]').forEach(button=>button.onclick=()=>{const index=Number(button.dataset.assetIndex),task=tasks.find(t=>t.id===activeAssetTaskId),max=Math.max(0,6-(task?.images.length||0));if(selectedAssetIndexes.includes(index))selectedAssetIndexes=selectedAssetIndexes.filter(x=>x!==index);else if(selectedAssetIndexes.length>=max)toast(max?'当前商品任务最多选择 '+max+' 张':'当前任务已达到 6 张上限');else selectedAssetIndexes.push(index);renderTaskAssetGrid()})}
function confirmTaskAssets(){const task=tasks.find(t=>t.id===activeAssetTaskId);if(!task)return;if(!selectedAssetIndexes.length){toast('请先选择商品素材');return}const chosen=selectedAssetIndexes.map(i=>taskAssetCatalog[i]).filter(Boolean).slice(0,6-task.images.length);task.images.push(...chosen.map(a=>({...a})));renderTasks();closeTaskAssets();toast(`已添加 ${chosen.length} 张素材到${task.name}`)}

function persistHistory(){try{localStorage.setItem(historyStorageKey,JSON.stringify(historyRecords))}catch(e){toast('浏览器空间不足，历史记录可能无法完整保存')}}
function createHistoryRecord(){const now=Date.now(),stamp=new Date(now).toISOString().replace(/[-:TZ.]/g,'').slice(0,14);return{id:`batch-${now}`,title:`批量任务-${stamp}`,createdAt:now,status:'排队中',mode,total:tasks.length,completed:0,tasks:tasks.map(t=>{const p=paramsFor(t);return{name:t.name,productId:t.productId||null,productName:t.productName||'',status:'排队中',images:(t.images||[]).map(im=>({src:im.src,name:im.name})),resultImages:[],platform:p.platform,market:p.market,language:p.language,model:p.model,ratio:p.ratio,quality:p.quality,sellingPoints:t.sellingPoints,style:t.styleMode==='custom'?(t.customStyle||'自定义风格'):t.style,plan:''}})}}
function startBatchGeneration(){const record=createHistoryRecord();activeSubmittedBatchId=record.id;historyRecords=[record,...historyRecords].slice(0,30);persistHistory();el('confirmBatchModal').classList.remove('open');document.body.style.overflow='';el('batchEditor').hidden=true;el('submittedState').hidden=false;renderSubmittedState(record);const delay=1350;record.tasks.forEach((task,index)=>{setTimeout(()=>{task.status='生成中';record.status='生成中';persistHistory();renderSubmittedState(record);setTimeout(()=>{task.status='成功';task.resultImages=(task.images||[]).slice(0,1).map(im=>({src:im.src,name:`${task.name} · 效果图`}));window.FashGeneratedAssets?.add(task.resultImages.map((image,index)=>({name:`${record.title} · ${task.name} · ${mode==='main'?'商品主图':'详情长图'} ${index+1}`,type:'image',source:'批量'+(mode==='main'?'商品主图':'详情图'),preview:image.src,productId:task.productId,productName:task.productName})));record.completed=record.tasks.filter(x=>x.status==='成功').length;if(record.completed===record.total)record.status='已完成';persistHistory();renderSubmittedState(record)},850)},index*delay)})}
function renderSubmittedState(record){if(activeSubmittedBatchId&&record.id!==activeSubmittedBatchId)return;const total=record.total,done=record.completed||0,pct=total?Math.round(done/total*100):0;el('submittedTitle').textContent=record.title;el('submittedSubtitle').textContent=record.status==='已完成'?'本批商品图片已生成，可查看最终效果图。':'正在生成本批商品图片，进度会同步到生图历史。';el('submittedStatus').textContent=record.status;el('submittedProgressText').textContent=`${done}/${total} · ${pct}%`;el('submittedProgressBar').style.width=`${pct}%`;el('submittedTasks').innerHTML=record.tasks.map((t,i)=>`<div class="submitted-task"><img class="submitted-task-thumb" src="${esc(t.images?.[0]?.src||'')}" alt="" onerror="this.style.visibility='hidden'"><div class="submitted-task-meta"><b>${esc(t.name||`商品任务 ${i+1}`)}</b><small>${esc(t.status||'排队中')}</small></div><div class="submitted-task-result">${(t.resultImages||[]).map(im=>`<img src="${esc(im.src)}" alt="效果图" onerror="this.style.display='none'">`).join('')}</div></div>`).join('')}

function renderMode(){
 const names=['白底主图','多角度图','细节图','场景图','卖点图','尺寸参数图','对比图','促销图'];
 const section=el('moduleSection'),container=el('moduleChips');el('countField').hidden=mode==='main';
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
 section.hidden=mode==='detail';
 if(mode!=='main'||defaultGlobal.module!=='custom'){container.className='module-note';container.textContent=mode==='main'&&defaultGlobal.imageTypes?.length?`当前套图类型：${defaultGlobal.imageTypes.map(x=>`${x.name}${x.count>1?' × '+x.count:''}`).join(' · ')}`:'';return}
 if(!(defaultGlobal.imageTypes||[]).length)defaultGlobal.imageTypes=names.map(name=>({name,count:1}));
 container.className='module-editor';container.innerHTML=names.map(name=>{const item=defaultGlobal.imageTypes.find(x=>x.name===name),checked=!!item;return `<div class="module-item ${checked?'selected':''}"><label><input type="checkbox" data-module-check="${name}" ${checked?'checked':''}>${name}</label><div class="module-count"><button data-module-qty="-" data-module-name="${name}" ${checked?'':'disabled'}>−</button><span>${item?.count||1} 张</span><button data-module-qty="+" data-module-name="${name}" ${checked?'':'disabled'}>＋</button></div></div>`}).join('');
 container.querySelectorAll('[data-module-check]').forEach(input=>input.onchange=()=>{const name=input.dataset.moduleCheck,list=defaultGlobal.imageTypes;defaultGlobal.imageTypes=input.checked?[...list,{name,count:1}]:list.filter(x=>x.name!==name);renderMode()});
 container.querySelectorAll('[data-module-qty]').forEach(button=>button.onclick=()=>{const item=defaultGlobal.imageTypes.find(x=>x.name===button.dataset.moduleName);if(item)item.count=Math.max(1,Math.min(8,item.count+(button.dataset.moduleQty==='+'?1:-1)));renderMode()});
}

function paramsFor(task){return {...defaultGlobal,...(task.override||{})}}
async function makeImagePreviewData(file){try{const bitmap=await createImageBitmap(file),scale=Math.min(1,520/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();return canvas.toDataURL('image/jpeg',.78)}catch(e){return URL.createObjectURL(file)}}
function writeSellingPointsDraft(task){const p=paramsFor(task);task.sellingPoints=task.sellingPoints||`商品名称：${task.name.replace(/商品任务\s*\d+/,'待填写商品名称')}\n核心卖点：请补充真实产品优势\n适用人群：\n使用场景：\n具体参数：\n目标平台：${p.platform}\n请勿虚构规格、认证、价格或功能。`;return task.sellingPoints}

function updateGenerateAvailability(){const count=tasks.length,missing=tasks.filter(t=>!t.images?.length).length;el('generate').disabled=count<3||missing>0;el('summary').textContent=count<3?`已添加 ${count} 个商品任务，至少需要 3 个` : missing?`共 ${count} 个商品任务 · 还有 ${missing} 个任务未上传商品图`:`共 ${count} 个商品任务 · 参数可按任务单独覆盖`;}
function renderTasks(){const root=el('tasks');if(!tasks.length){root.innerHTML='<div class="empty-tasks"><i class="fa-regular fa-images"></i><b>先添加商品任务</b><span>至少创建 3 个商品任务，并为每个任务上传商品图。</span></div>';updateGenerateAvailability();return}root.innerHTML=tasks.map((t,i)=>{const p=paramsFor(t);return `<section class="card task-card" data-task="${t.id}"><div class="task-head"><div class="task-index">${i+1}</div><div><div class="task-title">${esc(t.name||`商品任务 ${i+1}`)}</div><div class="task-sub">${t.override?'部分参数单独设置':'跟随全局'}</div></div><span class="task-spacer"></span><button class="icon-button" data-collapse title="收起/展开"><i class="fa-solid fa-chevron-${t.collapsed?'down':'up'}"></i></button><button class="icon-button" data-delete title="删除任务"><i class="fa-regular fa-trash-can"></i></button></div><div class="task-body" ${t.collapsed?'hidden':''}><div class="image-box"><div class="image-head"><div class="image-icon"><i class="fa-regular fa-image"></i></div><div><strong>产品图</strong><small>每个任务最多 6 张，可上传或从资产库选择</small></div><span class="image-count">${t.images.length}/6</span></div><div class="task-image-actions"><button class="btn" type="button" data-task-upload><i class="fa-solid fa-arrow-up-from-bracket"></i>&nbsp; 上传图片</button><button class="btn" type="button" data-task-assets><i class="fa-regular fa-folder-open"></i>&nbsp; 从资产库选择</button></div><label class="dropzone"><i class="fa-solid fa-arrow-up-from-bracket"></i><span>${t.images.length?'点击此处继续上传，或使用上方资产库选择':'点击上传商品图，或从资产库选择已有素材'}</span><div class="thumbs">${t.images.map(im=>`<img class="thumb" src="${esc(im.src)}" alt="${esc(im.name)}">`).join('')}</div><input type="file" data-images accept="image/png,image/jpeg,image/webp" multiple hidden></label></div><div class="field task-copy"><div class="task-field-head"><label>商品卖点</label><button class="btn ai-write" data-ai><i class="fa-solid fa-wand-magic-sparkles"></i>&nbsp; AI帮写</button></div><textarea class="task-brief" data-selling-points placeholder="商品名称、核心卖点、适用人群、使用场景、尺寸参数…">${esc(t.sellingPoints)}</textarea></div><div class="task-style"><div class="task-field-head"><label>设计风格</label><div class="style-mode-tabs"><button class="${t.styleMode==='recommended'?'active':''}" data-task-style-mode="recommended">风格推荐</button><button class="${t.styleMode==='custom'?'active':''}" data-task-style-mode="custom">自定义</button></div></div>${t.styleMode==='recommended'?`<div class="task-style-grid">${[['极简纯白科技轻奢风','亮银白与荧光绿，突出精致外观'],['东南亚活力潮街头风','高饱和色彩，年轻动感'],['暖调生活方式','自然光线与真实生活场景'],['极客数码暗夜氛围风','深色质感与科技光效']].map(([name,desc])=>`<button class="task-style-card ${t.style===name?'selected':''}" data-style-choice="${name}"><span class="style-swatch"></span><b>${name}</b><small>${desc}</small></button>`).join('')}</div>`:`<textarea class="task-brief custom-style-input" data-custom-style placeholder="描述希望的画面风格，例如：自然窗光、简洁留白、品牌配色…">${esc(t.customStyle)}</textarea>`}</div><div class="inherit"><div class="inherit-main"><strong>覆盖全局参数</strong><small>${t.override?'已启用单独设置':'跟随全局'}</small></div><button class="btn" data-override>${t.override?'恢复全局':'单独设置'}</button></div>${t.override?`<div class="override-fields">${[['platform','目标平台',['智能匹配','淘宝','天猫','京东','拼多多','抖音电商','Amazon','TikTok Shop']],['market','目标市场',['美国','加拿大','英国','德国','法国','西班牙','中国大陆','日本','韩国','泰国']],['language','目标语言',['无文字(纯视觉)','简体中文','英语','西班牙语','日语','韩语']],['model','模型',['Nano Banana 2','GPT Image 2.5','Flux Kontext']],['ratio','尺寸比例',['1:1 正方形','Auto 智能匹配','16:9 横屏','9:16 竖屏','1:3 超长图']],['quality','清晰度',['1K 标准','2K 高清','4K 超清']],...(mode==='detail'?[['count','详情图生成数量',['1 张','2 张','3 张','4 张','6 张']]]:[])].map(([key,label,opts])=>`<div class="field"><label>${label}</label><select data-override-field="${key}">${opts.map(o=>`<option ${p[key]===o?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}</div>`:''}${t.plan?`<div class="plan-box"><h3><i class="fa-solid fa-sparkles"></i> ${mode==='main'?'商品主图方案':'商品详情页方案'}</h3><p><b>适配：</b>${esc(p.platform)} · ${esc(p.language)} · ${esc(p.ratio)} · ${esc(p.quality)}${mode==='detail'?` · ${esc(p.count)}`:''}</p><p><b>商品信息：</b>${esc(t.sellingPoints||'待补充商品名称与核心卖点')}</p><p><b>方案建议：</b>${esc(t.plan)}</p><pre>${esc(t.generatedPrompt||'')}</pre></div>`:''}</div></section>`}).join('');updateGenerateAvailability();bindTasks()}
function bindTasks(){document.querySelectorAll('[data-task]').forEach(card=>{const t=tasks.find(x=>x.id===card.dataset.task);card.querySelector('[data-delete]').onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);renderTasks()};card.querySelector('[data-collapse]').onclick=()=>{t.collapsed=!t.collapsed;renderTasks()};card.querySelector('[data-override]').onclick=()=>{t.override=t.override?null:{...defaultGlobal};renderTasks()};card.querySelectorAll('[data-override-field]').forEach(field=>field.onchange=()=>{t.override[field.dataset.overrideField]=field.value;t.plan='';renderTasks()});card.querySelector('[data-selling-points]').oninput=e=>{t.sellingPoints=e.target.value;t.plan=''};card.querySelectorAll('[data-task-style-mode]').forEach(b=>b.onclick=()=>{t.styleMode=b.dataset.taskStyleMode;t.plan='';renderTasks()});card.querySelectorAll('[data-style-choice]').forEach(b=>b.onclick=()=>{t.style=b.dataset.styleChoice;t.plan='';renderTasks()});card.querySelector('[data-custom-style]')?.addEventListener('input',e=>{t.customStyle=e.target.value;t.plan=''});card.querySelector('[data-task-upload]').onclick=()=>card.querySelector('[data-images]').click();card.querySelector('[data-task-assets]').onclick=()=>openTaskAssets(t.id);card.querySelector('[data-images]').onchange=async e=>{const fs=[...e.target.files].slice(0,Math.max(0,6-t.images.length));for(const f of fs)t.images.push({src:await makeImagePreviewData(f),name:f.name});e.target.value='';renderTasks()};card.querySelector('[data-ai]').onclick=()=>{writeSellingPointsDraft(t);renderTasks();toast('已生成可编辑的商品卖点草稿')}})}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;tasks.forEach(t=>t.plan='');renderMode();renderTasks()});document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{defaultGlobal.module=b.dataset.module;document.querySelectorAll('[data-module]').forEach(x=>x.classList.toggle('active',x===b));renderMode();toast(`已切换${b.textContent}`)});for(const key of ['platform','market','language','model','ratio','quality','count'])el(key).onchange=()=>{defaultGlobal[key]=el(key).value;tasks.forEach(t=>t.plan='');renderTasks()};
el('addTask').onclick=()=>{tasks.push({id:crypto.randomUUID(),name:`商品任务 ${tasks.length+1}`,images:[],sellingPoints:'',styleMode:'recommended',style:'极简纯白科技轻奢风',customStyle:'',override:null,collapsed:false,plan:''});renderTasks();tasks.at(-1)&&document.querySelector(`[data-task="${tasks.at(-1).id}"]`).scrollIntoView({behavior:'smooth',block:'center'})};
el('generate').onclick=()=>{if(tasks.length<3){toast('至少需要创建 3 个商品任务');return}const missing=tasks.find(t=>!t.images?.length);if(missing){toast(`${missing.name}还没有上传商品图`);return}el('confirmSummary').innerHTML=`<span>${tasks.length} 个商品任务</span><span>${mode==='main'?'商品主图':'商品详情图'}</span><span>${esc(defaultGlobal.platform)}</span><span>${esc(defaultGlobal.model)}</span>`;el('confirmBatchModal').classList.add('open');document.body.style.overflow='hidden'};
el('confirmGenerate').onclick=startBatchGeneration;el('cancelBatch').onclick=()=>{el('confirmBatchModal').classList.remove('open');document.body.style.overflow=''};el('confirmBatchModal').onclick=e=>{if(e.target===el('confirmBatchModal')){el('confirmBatchModal').classList.remove('open');document.body.style.overflow=''}};el('newBatch').onclick=()=>{tasks=[];el('submittedState').hidden=true;el('batchEditor').hidden=false;renderTasks();window.scrollTo({top:0,behavior:'smooth'})};el('viewSubmittedHistory').onclick=()=>openHistoryDrawer(historyRecords[0]?.id);
el('globalAiWrite').onclick=()=>{if(!tasks.length){toast('请先新建商品任务');return}const empty=tasks.filter(t=>!t.sellingPoints?.trim());empty.forEach(writeSellingPointsDraft);renderTasks();toast(empty.length?`已为 ${empty.length} 个空白商品任务生成卖点草稿`:'所有商品任务都已填写卖点')};
el('confirmTaskAssets').onclick=confirmTaskAssets;document.querySelectorAll('[data-close-task-assets]').forEach(b=>b.onclick=closeTaskAssets);el('taskAssetModal').onclick=e=>{if(e.target===el('taskAssetModal'))closeTaskAssets()};
el('backBtn').onclick=()=>{location.href=seed.returnTo||'product-suite.html'};el('historyBtn').onclick=openHistoryDrawer;el('historyBack').onclick=()=>{el('historyDetailView').hidden=true;el('historyListView').hidden=false};el('historyBackdrop').onclick=closeHistoryDrawer;document.querySelectorAll('[data-close-history]').forEach(b=>b.onclick=closeHistoryDrawer);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeHistoryDrawer();if(el('confirmBatchModal').classList.contains('open')){el('confirmBatchModal').classList.remove('open');document.body.style.overflow=''}if(el('taskAssetModal').classList.contains('open'))closeTaskAssets()}});
document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('[data-module]').forEach(b=>b.classList.toggle('active',b.dataset.module===defaultGlobal.module));renderMode();renderTasks();
</script><script src="prototype-links.js"></script></body></html>
