<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FashMaker · 穿搭分离</title><link rel="stylesheet" href="ai-tryon.css?v=20261110-models-2"><link rel="stylesheet" href="prototype-links.css?v=20261110-models-2"><link rel="stylesheet" href="outfit-separation.css?v=20261110-models-2"></head>
<body><aside class="sidebar"><div class="brand">FM <strong>FashMaker</strong></div><nav><a href="index.html">详情图生成</a><a href="product-suite.html">商品套图</a><a href="product-video.html">商品生视频</a><a href="viral-remix.html">爆款复刻</a><a href="ai-tryon.html">AI 换装</a><a class="active" href="outfit-separation.html" aria-current="page">穿搭分离</a><a href="asset-library.html">资产库</a></nav><small>个人空间 · 本地交互原型</small></aside>
<main><header class="topbar"><span>图像创作 / <b>穿搭分离</b></span></header><div class="layout"><section class="config"><div class="config-head"><div class="eyebrow">OUTFIT TO ITEMS</div><h2>一键分离模特穿搭</h2><p>从一张模特图，生成完整的穿搭平铺图。</p></div><form id="form"><div class="scroll"><section class="panel"><h3>模特穿搭图 <span id="inputCount">0 / 1 · 必填</span></h3><div id="drop" class="drop"><svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="7" y="6" width="34" height="36" rx="7"/><path d="m12 34 10-11 7 7 5-5 7 9M24 13v8m-4-4 4-4 4 4"/></svg><strong>添加一张模特穿搭图</strong><small>拖拽至此，或从下方选择</small><div class="upload-actions"><button type="button" id="upload">本地上传</button><button type="button" id="library">素材 / 商品库</button></div></div><input type="file" id="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden><div id="inputPreview" hidden><button type="button" id="viewInput" class="input-photo"><img id="inputImage" alt="本次模特穿搭原图"></button><p id="inputName"></p><div class="upload-actions"><button type="button" id="replace">替换图片</button><button type="button" id="remove">移除</button></div></div><p class="file-help">JPG、PNG、WEBP · 单张不超过 10 MB</p><p id="productLink" class="link-note"></p><p id="inputError" role="alert"></p></section></div><footer><p id="hint" aria-live="polite">请先添加一张模特穿搭图</p><button id="generate" class="primary" disabled>一键分离穿搭</button><p class="local-note">仅保存在当前浏览器 · 不消耗积分</p></footer></form></section>
<section class="workspace"><div class="workspace-head"><span id="status" role="status">准备创作</span><div><button id="history">历史记录</button><button id="newTask">＋ 新建任务</button></div></div><div id="stage"></div></section></div></main>
<dialog id="picker"><header><h2>选择穿搭素材</h2><button id="closePicker" aria-label="关闭素材选择">×</button></header><input id="search" aria-label="搜索素材或商品名称" placeholder="搜索名称"><div class="tabs"><button id="materialsTab" class="selected">素材库</button><button id="productsTab">商品库</button></div><p class="muted">单选一张图片，选中后替换。仅从商品库选择才关联商品。</p><div id="options" class="options"></div></dialog>
<dialog id="preview"><header><h2 id="previewTitle">图片预览</h2><button id="closePreview">关闭</button></header><img id="previewImage" alt="图片大图预览"></dialog>
<dialog id="historyDialog"><header><h2>穿搭分离历史</h2><button id="closeHistory">关闭</button></header><div id="historyBody"></div></dialog><div id="toast" role="status"></div>
<script src="prototype-generated-assets.js?v=20261110-models-2"></script><script src="outfit-separation.js?v=20261110-models-2"></script><script src="shared-sidebar.js?v=20261112-model-management"></script><script src="custom-models.js?v=20261112-model-management"></script><script src="prototype-links.js?v=20261110-models-2"></script></body></html>
