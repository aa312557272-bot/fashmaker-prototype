<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户中心 · FashMaker</title><link rel="stylesheet" href="account-center.css?v=20261113-transfers-2"></head><body><main class="ac-main"><header class="ac-top"><span>工作空间 / <strong>账户中心</strong></span><a href="index.html">返回创作 ↗</a></header><div class="ac-layout"><aside class="ac-nav"><small>当前空间</small><label class="ac-sr" for="workspaceSelect">选择个人账户或团队</label><select id="workspaceSelect"></select><button id="createTeam" class="ac-create">＋ 创建团队</button><div class="ac-nav-label">账户中心</div><nav aria-label="账户中心"><a href="?tab=credits" data-tab="credits">↗ <span>积分明细</span></a><a href="?tab=orders" data-tab="orders">▤ <span>订单明细</span></a><a href="?tab=members" data-tab="members">♙ <span>成员管理</span></a></nav><p class="ac-space-note">个人账户与各团队的账目、成员分别展示。</p></aside><section class="ac-content"><div class="ac-title"><div><small id="spaceLabel"></small><h1 id="pageTitle">积分明细</h1><p id="pageSubtitle"></p></div><button id="rechargeAccount" class="ac-primary">充值 / 升级</button></div><div class="ac-demo">本地演示 · 账目、额度与邀请均为示例；不会真实扣款、发送邮件或更改线上会员。</div><div id="accountBody"></div></section></div></main><dialog id="teamDialog"><header><h2>创建团队</h2><button type="button" data-close="teamDialog" aria-label="关闭创建团队">×</button></header><p>创建一个独立的团队版演示空间，不产生购买或扣费。</p><form id="teamForm"><label for="teamName">团队名称</label><input id="teamName" name="teamName" required maxlength="50" placeholder="例如：电商内容团队"><p class="ac-form-error" id="teamError" role="status"></p><footer><button type="button" data-close="teamDialog">取消</button><button class="ac-primary" type="submit">创建团队</button></footer></form></dialog><dialog id="memberDialog"><header><h2 id="memberDialogTitle">邀请成员</h2><button type="button" data-close="memberDialog" aria-label="关闭成员表单">×</button></header><p id="memberDialogHint">创建本地待加入邀请，不发送真实邮件；邀请成员不会赠送好友奖励积分。</p><form id="memberForm"><label for="memberEmail">成员邮箱 <span>*</span></label><input id="memberEmail" name="email" type="email" required maxlength="254" placeholder="name@example.com"><label for="memberNote">备注</label><input id="memberNote" name="note" maxlength="100" placeholder="填写职责或备注（选填）"><div class="ac-field-grid"><div><label for="memberRole">角色</label><select id="memberRole" name="role"><option value="member">成员</option><option value="admin">管理员</option></select></div><div><label for="memberQuota">积分额度上限</label><input id="memberQuota" name="quota" type="number" min="0" step="1" placeholder="不限"></div></div><p class="ac-form-error" id="memberError" role="status"></p><footer><button type="button" data-close="memberDialog">取消</button><button class="ac-primary" type="submit" id="saveMember">创建邀请</button></footer></form></dialog><dialog id="transferDialog"><header><h2>派送积分至团队</h2><button type="button" data-close="transferDialog" aria-label="关闭派送积分">×</button></header><p>从个人账户派送到团队，两边同时记录流水。不产生付款或额外赠送积分。</p><form id="transferForm"><div class="ac-transfer-source"><small>积分来源账号</small><strong>Ricky Tang · 个人账户</strong><span>可用积分：<b id="transferSourceBalance"></b></span></div><label for="transferTarget">接收团队</label><select id="transferTarget" required></select><p id="transferTargetBalance"></p><label for="transferAmount">派送积分</label><input id="transferAmount" type="number" min="1" step="1" required placeholder="输入派送积分数"><label for="transferNote">备注（选填）</label><input id="transferNote" maxlength="200" placeholder="例如：本月团队创作额度"><p class="ac-form-error" id="transferError" role="status"></p><footer><button type="button" data-close="transferDialog">取消</button><button class="ac-primary" type="submit" id="confirmTransfer">确认派送</button></footer></form></dialog><dialog id="transferRecordsDialog" class="ac-wide-dialog"><header><h2>派送积分记录</h2><button type="button" data-close="transferRecordsDialog" aria-label="关闭派送记录">×</button></header><p id="transferRecordsCaption"></p><div id="transferRecordList"></div></dialog><dialog id="accountDetail"><header><h2 id="detailTitle">详情</h2><button type="button" data-close="accountDetail" aria-label="关闭详情">×</button></header><div id="detailBody"></div></dialog><div id="accountToast" role="status"></div><script src="account-store.js?v=20261113-transfers-2"></script><script src="shared-sidebar.js?v=20261113-team-link-4"></script><script src="account-center.js?v=20261113-actions-3"></script></body></html>
